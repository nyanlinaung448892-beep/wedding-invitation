<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Digital Invitation & Event Profile — ဖိတ်ကြားလွှာနှင့် အချက်အလက်စာမျက်နှာ">
  <meta name="theme-color" content="#1A0A2E">
  <meta name="robots" content="noindex, nofollow">

  <!-- Open Graph / Social Share -->
  <meta property="og:type"        content="website">
  <meta property="og:title"       content="Digital Invitation & Profile">
  <meta property="og:description" content="ဖိတ်ကြားလွှာစာမျက်နှာသို့ ကြိုဆိုပါသည်">
  <meta property="og:image"       content="">

  <!-- Twitter Card -->
  <meta name="twitter:card"        content="summary_large_image">
  <meta name="twitter:title"       content="Digital Invitation & Profile">
  <meta name="twitter:description" content="ဖိတ်ကြားလွှာစာမျက်နှာသို့ ကြိုဆိုပါသည်">

  <title>Digital Invitation & Profile</title>

  <!-- High-Performance Zero-Network Font System: Fast local system fonts + Supabase preconnect -->
  <link rel="dns-prefetch" href="https://kweylhqnzqnxnopqwrhj.supabase.co">
  <link rel="preconnect" href="https://kweylhqnzqnxnopqwrhj.supabase.co" crossorigin>

  <!-- Pre-render Template Detector: 0ms Instant Loading Theme Activation -->
  <script>
    (function() {
      try {
        const p = new URLSearchParams(window.location.search);
        const t = (p.get('t') || p.get('tpl') || p.get('template') || '').trim().toLowerCase();
        const slug = (p.get('id') || p.get('slug') || window.location.hash.replace(/^#/, '') || '').trim().toLowerCase();
        let tpl = t;
        if (!tpl && slug) {
          try {
            const c = localStorage.getItem('wedding_inv_cache_' + slug);
            if (c) {
              const parsed = JSON.parse(c);
              if (parsed && parsed.template_id) tpl = parsed.template_id;
            }
          } catch (_) {}
        }
        if (tpl) {
          window.__PRE_RESOLVED_TEMPLATE__ = tpl;
          document.documentElement.classList.add('preload-tpl-' + tpl);
        }
      } catch (_) {}
    })();
  </script>

  <!-- Global Design System CSS -->
  <link rel="stylesheet" href="css/global.css?v=21">
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════════
       Loading Screen — shown while engine fetches data & template
       ═══════════════════════════════════════════════════════════ -->
  <div id="loading-screen" role="status" aria-label="စာမျက်နှာ ဖွင့်နေပါသည်" aria-live="polite">
    <div class="loading-badge-wrap">
      <span class="loading-badge" id="loading-badge">✦ DIGITAL PROFILE ✦</span>
    </div>
    <div class="loading-rings" aria-hidden="true">
      <div class="loading-ring"></div>
      <div class="loading-ring"></div>
      <div class="loading-ring"></div>
      <span class="loading-center-icon" id="loading-center-icon">✦</span>
    </div>
    <p class="loading-text" id="loading-title">Digital Invitation & Profile</p>
    <p class="loading-sub" id="loading-sub-text">စာမျက်နှာ ဖွင့်နေပါသည်...</p>
    <div class="loading-progress-bar" aria-hidden="true">
      <div class="loading-progress-fill"></div>
    </div>
  </div>

  <!-- Synchronous Loading Screen Theme Hydrator (0ms paint) -->
  <script>
    (function() {
      try {
        const tpl = window.__PRE_RESOLVED_TEMPLATE__;
        if (!tpl) return;
        const themes = {
          'biz-card-gold': {
            cls: 'loading-theme-biz-card-gold',
            badge: '✦ APEX BUSINESS CARD ✦',
            title: 'Business Card & Profile',
            sub: 'လုပ်ငန်းအချက်အလက်များ ဖွင့်နေပါသည်...',
            icon: '💼'
          },
          'neon-birthday': {
            cls: 'loading-theme-neon-birthday',
            badge: '🎉 BIRTHDAY CELEBRATION 🎉',
            title: 'Neon Birthday Party',
            sub: 'မွေးနေ့ဖိတ်ကြားလွှာ ဖွင့်နေပါသည်...',
            icon: '🎂'
          },
          'floral-pink': {
            cls: 'loading-theme-floral-pink',
            badge: '💍 WEDDING INVITATION 💍',
            title: 'Sweet Pink Romance',
            sub: 'မင်္ဂလာဖိတ်ကြားလွှာ ဖွင့်နေပါသည်...',
            icon: '❤'
          }
        };
        const cfg = themes[tpl];
        if (cfg) {
          const el = document.getElementById('loading-screen');
          if (el) {
            el.classList.add(cfg.cls);
            const b = document.getElementById('loading-badge'); if (b) b.textContent = cfg.badge;
            const t = document.getElementById('loading-title'); if (t) t.textContent = cfg.title;
            const s = document.getElementById('loading-sub-text'); if (s) s.textContent = cfg.sub;
            const i = document.getElementById('loading-center-icon'); if (i) i.textContent = cfg.icon;
          }
        }
      } catch (_) {}
    })();
  </script>

  <!-- ═══════════════════════════════════════════════════════════
       Error Screen — shown when slug not found / network error
       ═══════════════════════════════════════════════════════════ -->
  <div id="error-screen" role="alert" aria-live="assertive">
    <div class="error-icon" aria-hidden="true">💌</div>
    <h1 class="error-title"  id="error-title">ဖိတ်ကြားလွှာ မတွေ့ပါ</h1>
    <p  class="error-message" id="error-message">
      ဤ URL သည် မမှန်ကန်ပါ သို့မဟုတ် ဖိတ်ကြားလွှာ ပိတ်ထားသည်။
    </p>
    <button id="error-retry-button" class="error-retry-btn" type="button" style="display: none;">
      🔄 ပြန်လည်ကြိုးစားမည်
    </button>
  </div>

  <!-- ═══════════════════════════════════════════════════════════
       Template Container — engine.js injects template HTML here
       ═══════════════════════════════════════════════════════════ -->
  <div id="template-container" aria-live="polite"></div>

  <!-- Template Engine (ES Module) -->
  <script type="module" src="js/engine.js?v=21"></script>

  <!-- Service Worker Registration (100% Offline Support) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=21').catch(err => {
          console.warn('[SW] ServiceWorker registration notice:', err);
        });
      });
    }
  </script>
</body>
</html>
