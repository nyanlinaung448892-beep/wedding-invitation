<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ထိမ်းမြားမင်္ဂလာ ဖိတ်ကြားလွှာ — Digital Wedding Invitation">
  <meta name="theme-color" content="#1A0A2E">
  <meta name="robots" content="noindex, nofollow">

  <!-- Open Graph / Social Share -->
  <meta property="og:type"        content="website">
  <meta property="og:title"       content="ထိမ်းမြားမင်္ဂလာ ဖိတ်ကြားလွှာ">
  <meta property="og:description" content="ထိမ်းမြားမင်္ဂလာပွဲသို့ ကြိုဆိုပါသည်">
  <meta property="og:image"       content="">

  <!-- Twitter Card -->
  <meta name="twitter:card"        content="summary_large_image">
  <meta name="twitter:title"       content="ထိမ်းမြားမင်္ဂလာ ဖိတ်ကြားလွှာ">
  <meta name="twitter:description" content="ထိမ်းမြားမင်္ဂလာပွဲသို့ ကြိုဆိုပါသည်">

  <title>ထိမ်းမြားမင်္ဂလာ ဖိတ်ကြားလွှာ</title>

  <!-- Google Fonts: Cormorant Garamond, Alex Brush, Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&display=swap"
    rel="stylesheet"
  >

  <!-- Global Design System CSS -->
  <link rel="stylesheet" href="css/global.css?v=3">
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════════
       Hearts Container — falling hearts spawned by engine.js
       ═══════════════════════════════════════════════════════════ -->
  <div id="hearts-container" aria-hidden="true" role="presentation"></div>

  <!-- ═══════════════════════════════════════════════════════════
       Loading Screen — shown while engine fetches data & template
       ═══════════════════════════════════════════════════════════ -->
  <div id="loading-screen" role="status" aria-label="ဖိတ်ကြားလွှာ ဖွင့်နေပါသည်" aria-live="polite">
    <div class="loading-rings" aria-hidden="true">
      <div class="loading-ring"></div>
      <div class="loading-ring"></div>
      <div class="loading-ring"></div>
    </div>
    <p class="loading-text">Wedding Invitation</p>
    <p class="loading-sub">ဖိတ်ကြားလွှာ ဖွင့်နေပါသည်...</p>
  </div>

  <!-- ═══════════════════════════════════════════════════════════
       Error Screen — shown when slug not found / template error
       ═══════════════════════════════════════════════════════════ -->
  <div id="error-screen" role="alert" aria-live="assertive">
    <div class="error-icon" aria-hidden="true">💌</div>
    <h1 class="error-title"  id="error-title">ဖိတ်ကြားလွှာ မတွေ့ပါ</h1>
    <p  class="error-message" id="error-message">
      ဤ URL သည် မမှန်ကန်ပါ သို့မဟုတ် ဖိတ်ကြားလွှာ ပိတ်ထားသည်။
    </p>
  </div>

  <!-- ═══════════════════════════════════════════════════════════
       Template Container — engine.js injects template HTML here
       ═══════════════════════════════════════════════════════════ -->
  <div id="template-container" aria-live="polite"></div>

  <!-- Template Engine (ES Module) -->
  <script type="module" src="js/engine.js?v=3"></script>

</body>
</html>
