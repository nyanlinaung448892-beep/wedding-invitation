<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>၄၀၄ — စာမျက်နှာ ရှာမတွေ့ပါ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css?v=10">
  <style>
    body {
      background: radial-gradient(circle at center, #2d1245 0%, #120721 100%);
      color: #FFF8F0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 24px;
      font-family: var(--font-myanmar, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
      text-align: center;
    }
    .notfound-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 40px 28px;
      max-width: 440px;
      width: 100%;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
    }
    .notfound-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }
    .notfound-title {
      font-family: var(--font-heading-en, 'Cormorant Garamond', serif);
      font-size: 2.2rem;
      margin: 0 0 8px;
      color: var(--color-primary, #C9A96E);
    }
    .notfound-sub {
      font-size: 1rem;
      color: #e2e8f0;
      margin: 0 0 24px;
      line-height: 1.6;
    }
    .notfound-btn {
      display: inline-block;
      padding: 12px 28px;
      background: linear-gradient(135deg, #C9A96E 0%, #A37F43 100%);
      color: #1A0A2E;
      text-decoration: none;
      font-weight: 700;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(201, 169, 110, 0.35);
      transition: all 0.25s ease;
    }
    .notfound-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(201, 169, 110, 0.5);
    }
  </style>
</head>
<body>
  <div class="notfound-card">
    <div class="notfound-icon">💌</div>
    <h1 class="notfound-title">404 — Not Found</h1>
    <p class="notfound-sub">သင်ရှာဖွေနေသော ဖိတ်ကြားလွှာစာမျက်နှာကို ရှာမတွေ့ပါ သို့မဟုတ် ရွှေ့ပြောင်းသွားပါပြီ။</p>
    <a href="index.html" class="notfound-btn" id="home-link">ပင်မစာမျက်နှာသို့ သွားမည်</a>
  </div>
  <script>
    // Intelligent SPA redirect for GitHub Pages deep paths
    (function() {
      var path = window.location.pathname;
      var match = path.match(/\/([a-z0-9-]+)(?:\.html)?$/i);
      if (match && match[1] && !['index', 'admin', 'partner', '404'].includes(match[1])) {
        // Redirect deep path /<slug> to /index.html?id=<slug>
        window.location.replace('index.html?id=' + encodeURIComponent(match[1]));
      }
    })();
  </script>
</body>
</html>
